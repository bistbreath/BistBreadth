name: Refresh BIST equal-weight charts

on:
  workflow_dispatch:
  schedule:
    # During BIST trading, offset from :00 to reduce GitHub schedule delays.
    - cron: "7,22,37,52 10-17 * * 1-5"
      timezone: "Europe/Istanbul"
    # One final run after the 18:10 closing session.
    - cron: "15 18 * * 1-5"
      timezone: "Europe/Istanbul"
  push:
    branches: [main]
    paths:
      - "scripts/build_indices.py"
      - "data/**"
      - "requirements.txt"
      - "docs/app.js"
      - "docs/financials.js"
      - "docs/data/financials.json"
      - "docs/index.html"
      - ".github/workflows/refresh-index-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-bist-chart-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install data pipeline
        run: python -m pip install -r requirements.txt
      - name: Download and calculate index series
        run: python scripts/build_indices.py
      - name: Publish chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/indices.json docs/data/rs_ratings.json
          if git diff --cached --quiet; then
            echo "Chart data has not changed."
          else
            git commit -m "Refresh BIST equal-weight chart data"
            git push origin main
          fi
